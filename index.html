<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designelements</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Strichpunkt+Sans:wght@400;700&display=swap');
        
        body {
            font-family: 'Strichpunkt Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            color: #333;
            transition: background-color 0.5s;
        }
        body.time-up {
            background-color: #ffcccc;
        }
        .title-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .title-container h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }
        .title-container h2 {
            margin: 5px 0 0;
            font-size: 18px;
            font-weight: 400;
            color: #666;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 360px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 25px;
        }
        .timer, .score {
            font-size: 20px;
            font-weight: 700;
        }
        .timer {
            color: #d9534f;
        }
        .score {
            color: #2e6da4;
        }
        .card-container {
            width: 360px;
            height: 529px;
            perspective: 1000px;
            cursor: pointer;
            transition: transform 0.3s;
            margin-bottom: 15px;
        }
        .card-container:hover {
            transform: scale(1.05);
        }
        .card-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }
        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        .card-front {
            transform: rotateY(0deg);
        }
        .card-back {
            transform: rotateY(180deg);
        }
        .card-wrapper.flip {
            transform: rotateY(180deg);
        }
        .instruction {
            margin-top: 0;
            text-align: center;
            font-style: italic;
            color: #666;
            font-size: 14px;
        }
        @media (max-width: 600px) {
            .card-container, .game-container {
                width: 300px;
            }
            .header {
                width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="title-container">
            <h1>Designelements</h1>
            <h2>The Card Game</h2>
        </div>
        <div class="header">
            <div class="timer" id="timer">03:00</div>
            <div class="score">Punkte: <span id="score">0</span></div>
        </div>
        <div class="card-container" onclick="showRandomImage()">
            <div class="card-wrapper" id="cardWrapper">
                <div class="card card-front" id="cardFront" style="background-image: url('./20260603_Spielkartengestaltung00.png');"></div>
                <div class="card card-back" style="background-image: url('./20260603_Spielkartengestaltung00.png');"></div>
            </div>
        </div>
        <p class="instruction">Klicke auf die Karte, um ein zufälliges Bild anzuzeigen</p>
    </div>

    <script>
        // Liste der Bilder (20260603_Spielkartengestaltung01.png bis 20260603_Spielkartengestaltung30.png)
        const images = [];
        for (let i = 1; i <= 30; i++) {
            const paddedNumber = String(i).padStart(2, '0');
            images.push(`./20260603_Spielkartengestaltung${paddedNumber}.png`);
        }

        // Timer-Variablen
        let countdown;
        let timeLeft = 180; // 3 Minuten in Sekunden
        let score = 0;

        // Punktescala aktualisieren
        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        // Timer anzeigen
        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // Timer starten
        function startTimer() {
            clearInterval(countdown);
            timeLeft = 180;
            updateTimer();
            document.body.classList.remove('time-up');
            countdown = setInterval(() => {
                timeLeft--;
                updateTimer();
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    document.getElementById('timer').textContent = "Zeit abgelaufen!";
                    document.body.classList.add('time-up');
                    // Punkt abziehen, wenn die Zeit abgelaufen ist
                    score = Math.max(0, score - 1);
                    updateScore();
                }
            }, 1000);
        }

        // Funktion, um ein zufälliges Bild anzuzeigen
        function showRandomImage() {
            const cardWrapper = document.getElementById('cardWrapper');
            const cardFront = document.getElementById('cardFront');
            const randomIndex = Math.floor(Math.random() * images.length);
            const randomImage = images[randomIndex];

            // Animation: Karte dreht sich um
            cardWrapper.classList.add('flip');
            setTimeout(() => {
                cardFront.style.backgroundImage = `url('${randomImage}')`;
                cardWrapper.classList.remove('flip');
            }, 300);

            // Punkte erhöhen
            score++;
            updateScore();

            // Timer starten
            startTimer();
        }
    </script>
</body>
</html>
